<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Crie sua conta | MUSICPLAY</title>
    <meta
      name="description"
      content="Crie sua conta MUSICPLAY e comece uma jornada musical no seu ritmo."
    >
    <meta name="theme-color" content="#090711">
    <meta name="color-scheme" content="dark">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%23a24cff' d='M9 18V5l12-2v13a3 3 0 1 1-2-2.83V7l-8 1v11a3 3 0 1 1-2-2.83Z'/%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Poppins:wght@700;800&amp;display=swap">
    <link rel="stylesheet" href="../css/main.css">
    <script type="module" src="../js/main.js"></script>
  </head>
  <body data-page="signup">
    <a class="skip-link" href="#main-content">Pular para o conteúdo</a>
    <main class="auth-page" id="main-content" tabindex="-1">
      <div class="auth-page__container">
        <a class="brand auth-page__brand" href="../index.html" aria-label="MUSICPLAY, página inicial">
          <span class="brand__text">MUSICPLAY</span>
        </a>
        <section class="auth-card" aria-labelledby="signup-title">
          <header class="auth-card__header">
            <h1 class="auth-card__title" id="signup-title">Crie sua conta</h1>
            <p class="auth-card__description">Sua jornada musical começa com um primeiro passo.</p>
          </header>

          <form class="auth-form" data-form="signup" novalidate>
            <div class="form-field">
              <label class="form-field__label" for="signup-first-name">Nome</label>
              <input
                class="form-field__input"
                id="signup-first-name"
                name="firstName"
                type="text"
                autocomplete="given-name"
                required
                aria-describedby="signup-first-name-error"
                data-field="first-name"
              >
              <p class="form-field__error" id="signup-first-name-error" data-field-error="first-name" aria-live="polite"></p>
            </div>

            <div class="form-field">
              <label class="form-field__label" for="signup-last-name">Sobrenome</label>
              <input
                class="form-field__input"
                id="signup-last-name"
                name="lastName"
                type="text"
                autocomplete="family-name"
                required
                aria-describedby="signup-last-name-error"
                data-field="last-name"
              >
              <p class="form-field__error" id="signup-last-name-error" data-field-error="last-name" aria-live="polite"></p>
            </div>

            <div class="form-field">
              <label class="form-field__label" for="signup-email">E-mail</label>
              <input
                class="form-field__input"
                id="signup-email"
                name="email"
                type="email"
                autocomplete="email"
                inputmode="email"
                required
                aria-describedby="signup-email-error"
                data-field="email"
              >
              <p class="form-field__error" id="signup-email-error" data-field-error="email" aria-live="polite"></p>
            </div>

            <div class="form-field">
              <label class="form-field__label" for="signup-password">Senha</label>
              <div class="form-field__password">
                <input
                  class="form-field__input"
                  id="signup-password"
                  name="password"
                  type="password"
                  autocomplete="new-password"
                  minlength="6"
                  required
                  aria-describedby="signup-password-hint signup-password-error"
                  data-field="password"
                >
                <button
                  class="form-field__password-toggle"
                  type="button"
                  data-action="toggle-password"
                  aria-label="Mostrar senha"
                  aria-controls="signup-password"
                  aria-pressed="false"
                >
                  Mostrar
                </button>
              </div>
              <p class="form-field__hint" id="signup-password-hint">Use pelo menos 6 caracteres.</p>
              <p class="form-field__error" id="signup-password-error" data-field-error="password" aria-live="polite"></p>
            </div>

            <div class="form-field form-field--checkbox">
              <div class="form-field__checkbox-control">
                <input
                  class="form-field__checkbox"
                  id="signup-terms"
                  name="terms"
                  type="checkbox"
                  required
                  aria-describedby="signup-terms-error"
                  data-field="terms"
                >
                <label class="form-field__label form-field__label--checkbox" for="signup-terms">
                  Li e concordo com os termos de uso e a política de privacidade.
                </label>
              </div>
              <p class="form-field__error" id="signup-terms-error" data-field-error="terms" aria-live="polite"></p>
            </div>

            <p class="auth-form__feedback" data-form-feedback role="status" aria-live="polite" aria-atomic="true"></p>
            <button class="button button--primary auth-form__submit" type="submit" data-action="signup">
              Criar conta
            </button> 
          </form>

          <p class="auth-card__footer">
            Já tem conta? <a href="./login.html">Entrar</a>
          </p>
        </section>
      </div>
    </main>

    <div class="app-feedback" data-app-feedback role="status" aria-live="polite" aria-atomic="true"></div>
    <div
      class="toast-region"
      data-toast-container
      role="status"
      aria-live="polite"
      aria-relevant="additions text"
    ></div>
  </body>
</html>
