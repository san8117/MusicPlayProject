<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Entrar na sua conta | MUSICPLAY</title>
    <meta
      name="description"
      content="Entre na sua conta MUSICPLAY e continue sua jornada musical."
    >
    <link rel="stylesheet" href="../css/main.css">
    <script type="module" src="../js/main.js"></script>
  </head>
  <body data-page="login">
    <a class="skip-link" href="#main-content">Pular para o conteúdo</a>
    <main class="auth-page" id="main-content" tabindex="-1">
      <div class="auth-page__container">
        <a class="brand auth-page__brand" href="../index.html" aria-label="MUSICPLAY, página inicial">
          <span class="brand__text">MUSICPLAY</span>
        </a>
        <section class="auth-card" aria-labelledby="login-title">
          <header class="auth-card__header">
            <h1 class="auth-card__title" id="login-title">Que bom ter você de volta!</h1>
            <p class="auth-card__description">Entre na sua conta para continuar aprendendo.</p>
          </header>

          <form class="auth-form" data-form="login" novalidate>
            <div class="form-field">
              <label class="form-field__label" for="login-email">E-mail</label>
              <input
                class="form-field__input"
                id="login-email"
                name="email"
                type="email"
                autocomplete="email"
                inputmode="email"
                required
                aria-describedby="login-email-error"
                data-field="email"
              >
              <p class="form-field__error" id="login-email-error" data-field-error="email" aria-live="polite"></p>
            </div>

            <div class="form-field">
              <label class="form-field__label" for="login-password">Senha</label>
              <div class="form-field__password">
                <input
                  class="form-field__input"
                  id="login-password"
                  name="password"
                  type="password"
                  autocomplete="current-password"
                  required
                  aria-describedby="login-password-error"
                  data-field="password"
                >
                <button
                  class="form-field__password-toggle"
                  type="button"
                  data-action="toggle-password"
                  aria-label="Mostrar senha"
                  aria-controls="login-password"
                  aria-pressed="false"
                >
                  Mostrar
                </button>
              </div>
              <p class="form-field__error" id="login-password-error" data-field-error="password" aria-live="polite"></p>
            </div>

            <p class="auth-form__feedback" data-form-feedback role="status" aria-live="polite" aria-atomic="true"></p>
            <button class="button button--primary auth-form__submit" type="submit" data-action="login">
              Entrar
            </button>
          </form>

          <p class="auth-card__footer">
            Ainda não tem conta? <a href="./signup.html">Criar conta</a>
          </p>
        </section>
      </div>
    </main>

    <div class="app-feedback" data-app-feedback role="status" aria-live="polite" aria-atomic="true"></div>
    <div
      class="toast-region"
      data-toast-container
      role="status"
      aria-live="polite"
      aria-relevant="additions text"
    ></div>
  </body>
</html>
